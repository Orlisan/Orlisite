<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>OrliSite</title>
    <meta
      name="description"
      content="Sito ufficiale del modder e developer Orlisan, qui illustrate le sue mod e i suoi progetti"
    />
    <meta
      name="keywords"
      content="minecraft, mod, italia, minecraft ita, orlisan, javaita, orlisan12, java, javascript"
    />
    <meta name="author" content="Orlisan" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orlisan.github.io/Orlisite" />
    <meta property="og:title" content="Sito ufficiale di Orlisan" />
    <meta
      property="og:description"
      content="Sito ufficiale di Orlisan, mod e progetti qui raccolti"
    />
    <meta
      property="og:image"
      content="https://orlisan.github.io/Orlisite/textures/favicon.svg"
    />
    <meta property="og:site_name" content="Orlisite" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="orlistyle.css" />
    <link rel="icon" type="image/svg+xml" href="textures/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="schermo_sopra" aria-label="Sezione superiore del sito">
      <input
        type="text"
        class="barra_di_ricerca"
        aria-label="Barra di Ricerca"
      />
      <div class="separatore_schermi" aria-hidden="true"></div>
      <div class="ombra_separatore_schermi" aria-hidden="true"></div>
      <div class="spazio_nero_per_far_slidare_il_menu" aria-hidden="true"></div>
      <div
        class="menu_mods"
        aria-label="Menu con sopra le mod di minecraft"
      ></div>
      <div
        class="menu_altri_progetti"
        aria-label="Menu con gli altri progetti dell Autore"
      ></div>
      <div
        class="language_button"
        aria-label="Bottone di selezione lingua"
      ></div>
      <div
        class="tooltip_lingua"
        aria-label="Istruzioni su come cambiare la lingua"
      ></div>
    </div>
    <div class="schermo_sotto" aria-label="Sezione inferiore del sito">
      <div class="inizio_sez_chi_sono" aria-hidden="true">
        <div class="ombra_inizio_sez_chi_sono" aria-hidden="true"></div>
      </div>
      <h1 class="chi_sono"></h1>
    </div>
    <script type="module" src="./script.js"></script>
    <script type="module" src="./traduttore.js"></script>
  </body>
</html>
