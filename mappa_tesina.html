<script>
  //Parte fatta da me
const centri = document.querySelectorAll(".rect_centro");
centri.forEach(centro => {
  centro.addEventListener("mouseenter", function() {
    centro.style.fill = centro.getAttribute("color-pressed");
  });
  centro.addEventListener("mouseleave", function() {
    centro.style.fill = "rgba(0,20,0,0.85)";
  });
});
//Fine parte fatta da me, rect centri e cose html di color-pressed messi da me
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
function resizeCanvas() {
    canvas.width = Math.max(window.innerWidth, document.body.scrollWidth);
    canvas.height = Math.max(window.innerHeight, document.body.scrollHeight);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
   window.addEventListener("load", function() {
    resizeCanvas();
    const anim = document.getElementById('map');
    anim.style.transform = "translateY(0%)";
    anim.style.transition = "transform 2s ease";
    anim.style.transform = "translateY(-12%)";
   });
//L'AI aveva messo const e dava unchaught type error
let cols=Math.floor(canvas.width/14);
let drops=Array(cols).fill(1);
const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ01アBC'.split('');
function draw(){
   if (cols !== Math.floor(canvas.width / 14)) {
        cols = Math.floor(canvas.width / 14);
        drops = Array(cols).fill(1);
    }
    
  ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0f0';ctx.font='12px monospace';
  drops.forEach((y,i)=>{
    const c=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(c,i*14,y*14);
    if(y*14>canvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  });
}
setInterval(draw,50);

</script>
